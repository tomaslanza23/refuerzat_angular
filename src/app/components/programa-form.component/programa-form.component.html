<div class="admin-container">
  <div class="admin-header">
    <div class="header-content">
      <h1 class="page-title">
        {{ esEdicion ? 'Editar Programa' : 'Nuevo Programa' }}
      </h1>
      <p class="page-subtitle">
        {{ esEdicion
          ? 'Modificá los datos del programa de formación'
          : 'Creá un nuevo programa de formación' }}
      </p>
    </div>
  </div>

  <div class="form-card">

    <form [formGroup]="form" (ngSubmit)="guardar()">

      <div class="form-group">
        <label class="form-label">
          Nombre del programa <span class="required">*</span>
        </label>

        <input
          type="text"
          class="form-input"
          formControlName="nombre"
          placeholder="Ej: Programación Full Stack"
        />

        <div class="form-error"
             *ngIf="form.get('nombre')?.touched && form.get('nombre')?.invalid">
          El nombre es obligatorio
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Descripción</label>

        <textarea
          class="form-textarea"
          rows="4"
          formControlName="descripcion"
          placeholder="Descripción del programa (opcional)">
        </textarea>
      </div>

      <div class="form-group" *ngIf="esEdicion">
        <label class="status-toggle">
          <input type="checkbox" formControlName="activo" />
          <span class="toggle-ui"></span>
          <span class="toggle-label">
            {{ form.get('activo')?.value ? 'Programa activo' : 'Programa inactivo' }}
          </span>
        </label>
      </div>
      <div class="form-error-global" *ngIf="error">
        {{ error }}
      </div>
      <div class="form-actions">
<button
  type="button"
  class="btn-secondary"
  (click)="cancelar()">
  Cancelar
</button>

        <button
          type="submit"
          class="btn-primary"
          [disabled]="cargando">
          {{ esEdicion ? 'Guardar cambios' : 'Crear programa' }}
        </button>
      </div>

    </form>

  </div>
</div>
